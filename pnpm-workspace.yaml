packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - core-js
  - esbuild
  - sharp
  - "@nestjs/core"
  - unrs-resolver
